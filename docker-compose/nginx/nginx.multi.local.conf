# ============================================================================
# NGINX Configuration for Multi-Site Local Development (HTTPS)
# ============================================================================
# IMPORTANT: Container ports must match docker-compose.multi.yml base file:
#   - Port 80   -> Site gg HTTPS (mapped to host via NGINX_HTTP_PORT env var)
#   - Port 443  -> Site flynn HTTPS (mapped to host via NGINX_HTTPS_PORT env var)
#   - Port 8080 -> Health endpoint (mapped to host via NGINX_HEALTH_PORT)
#   - Port 8081 -> Site gg HTTP->HTTPS redirect
#   - Port 8082 -> Site flynn HTTP->HTTPS redirect
#
# Docker Compose MERGES ports from base + override files. Do NOT add ports
# in docker-compose.multi.local.yml or they will conflict.
#
# Access sites at:
#   - Site gg:     https://localhost:8181 (NGINX_HTTP_PORT=8181 -> container:80)
#   - Site flynn:  https://localhost:8182 (NGINX_HTTPS_PORT=8182 -> container:443)
#   - Health:      http://localhost:9090/health
# ============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Proxy cache for static assets
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m max_size=1g inactive=24h use_temp_path=off;

    # === Site: gg Upstreams ===
    upstream api_gg {
        server api-gg:8080;
        keepalive 16;
    }
    upstream frontend_gg {
        server frontend-gg:3000;
        keepalive 16;
    }

    # === Site: flynn Upstreams ===
    upstream api_flynn {
        server api-flynn:8080;
        keepalive 16;
    }
    upstream frontend_flynn {
        server frontend-flynn:3000;
        keepalive 16;
    }

    # Health check endpoint (container port 8080 -> host NGINX_HEALTH_PORT)
    server {
        listen 8080;
        server_name _;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # === Site: gg HTTPS (container port 80 -> host NGINX_HTTP_PORT) ===
    server {
        listen 80 ssl http2;
        server_name localhost;

        # SSL configuration (self-signed certificate for localhost)
        ssl_certificate /etc/nginx/ssl/gg/server.crt;
        ssl_certificate_key /etc/nginx/ssl/gg/server.key;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        client_max_body_size 20M;

        # Security headers (relaxed for local development)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;

        # API routes
        location /api/ {
            proxy_pass http://api_gg/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploaded images
        location /images/ {
            proxy_pass http://api_gg/images/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Frontend
        location / {
            proxy_pass http://frontend_gg;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # === Site: flynn HTTPS (container port 443 -> host NGINX_HTTPS_PORT) ===
    server {
        listen 443 ssl http2;
        server_name localhost;

        # SSL configuration (self-signed certificate for localhost)
        ssl_certificate /etc/nginx/ssl/flynn/server.crt;
        ssl_certificate_key /etc/nginx/ssl/flynn/server.key;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        client_max_body_size 20M;

        # Security headers (relaxed for local development)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;

        # API routes
        location /api/ {
            proxy_pass http://api_flynn/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploaded images
        location /images/ {
            proxy_pass http://api_flynn/images/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Frontend
        location / {
            proxy_pass http://frontend_flynn;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # === HTTP to HTTPS redirect for site gg (container port 8081) ===
    server {
        listen 8081;
        server_name localhost;
        return 301 https://localhost:8181$request_uri;
    }

    # === HTTP to HTTPS redirect for site flynn (container port 8082) ===
    server {
        listen 8082;
        server_name localhost;
        return 301 https://localhost:8182$request_uri;
    }
}
