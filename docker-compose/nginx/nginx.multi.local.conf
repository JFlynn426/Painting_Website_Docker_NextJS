# ============================================================================
# NGINX Configuration for Multi-Site Local Development
# ============================================================================
# IMPORTANT: Container ports must match docker-compose.multi.yml base file:
#   - Port 80   -> Site gg (mapped to host via NGINX_HTTP_PORT env var)
#   - Port 443  -> Site flynn (mapped to host via NGINX_HTTPS_PORT env var)
#   - Port 8080 -> Health endpoint (mapped to host via NGINX_HEALTH_PORT)
#
# Docker Compose MERGES ports from base + override files. Do NOT add ports
# in docker-compose.multi.local.yml or they will conflict.
#
# Access sites at:
#   - Site gg:     http://localhost:8181 (NGINX_HTTP_PORT=8181 -> container:80)
#   - Site flynn:  http://localhost:8182 (NGINX_HTTPS_PORT=8182 -> container:443)
#   - Health:      http://localhost:9090/health
# ============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Proxy cache for static assets
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m max_size=1g inactive=24h use_temp_path=off;

    # === Site: gg Upstreams ===
    upstream api_gg {
        server api-gg:8080;
        keepalive 16;
    }
    upstream frontend_gg {
        server frontend-gg:3000;
        keepalive 16;
    }

    # === Site: flynn Upstreams ===
    upstream api_flynn {
        server api-flynn:8080;
        keepalive 16;
    }
    upstream frontend_flynn {
        server frontend-flynn:3000;
        keepalive 16;
    }

    # Health check endpoint (container port 8080 -> host NGINX_HEALTH_PORT)
    server {
        listen 8080;
        server_name _;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # === Site: gg (container port 80 -> host NGINX_HTTP_PORT) ===
    server {
        listen 80;
        server_name localhost;

        client_max_body_size 20M;

        # Security headers (relaxed for local development)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;

        # API routes
        location /api/ {
            proxy_pass http://api_gg/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploaded images
        location /images/ {
            proxy_pass http://api_gg/images/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Frontend
        location / {
            proxy_pass http://frontend_gg;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # === Site: flynn (container port 443 -> host NGINX_HTTPS_PORT) ===
    server {
        listen 443;
        server_name localhost;

        client_max_body_size 20M;

        # Security headers (relaxed for local development)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;

        # API routes
        location /api/ {
            proxy_pass http://api_flynn/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploaded images
        location /images/ {
            proxy_pass http://api_flynn/images/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Frontend
        location / {
            proxy_pass http://frontend_flynn;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
